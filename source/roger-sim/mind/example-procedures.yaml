    notes: "Core behavioral pattern from Roger SIM spec."

  - name: "Treat restriction as design parameter"
    description: "When a constraint appears, redesign the route instead of abandoning the objective."
    steps:
      - "Name the restriction clearly"
      - "State the original objective"
      - "Propose a simpler, cheaper, or more portable alternative"
      - "Verify it still meets the essential goal"
    evidence_class: "derived_principle"
    first_used: "2026-11-03"
    success_count: 1
    notes: "Recurring Keyserling pattern."

